<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Leyton Automation Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --leyton-navy: #002D5B;
            --leyton-blue: #0057A8;
            --leyton-light: #E8F0FB;
        }
        body {
            background-color: #F0F4F8;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #1a2332;
        }
        /* ── Navbar ── */
        .navbar {
            background-color: var(--leyton-navy) !important;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.3px;
            color: #fff !important;
        }
        .navbar-brand span { color: #5BA4F5; }
        .nav-link {
            color: rgba(255,255,255,0.78) !important;
            font-size: 0.9rem;
            padding: 0.5rem 1rem !important;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: #fff !important; }
        /* ── Cards ── */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        /* ── Stat cards ── */
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-icon {
            width: 52px; height: 52px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }
        /* ── Service cards ── */
        .service-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .service-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,45,91,0.15) !important;
        }
        .service-icon {
            width: 48px; height: 48px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            background: var(--leyton-light);
            color: var(--leyton-blue);
        }
        /* ── Status badges ── */
        .badge-success-soft {
            background: #d1fae5; color: #065f46;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
        .badge-failed-soft {
            background: #fee2e2; color: #991b1b;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
        .badge-running-soft {
            background: #dbeafe; color: #1e40af;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
        .badge-never-soft {
            background: #f3f4f6; color: #6b7280;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
        /* ── Page header ── */
        .page-header {
            background: linear-gradient(135deg, var(--leyton-navy) 0%, var(--leyton-blue) 100%);
            color: white;
            padding: 1.75rem 2rem;
            border-radius: 14px;
            margin-bottom: 1.75rem;
        }
        .page-header h4 { margin: 0; font-weight: 700; }
        .page-header p { margin: 0.25rem 0 0; opacity: 0.8; font-size: 0.9rem; }
        /* ── Table ── */
        .table th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.6px; color: #6b7280; font-weight: 600; }
        .table td { font-size: 0.88rem; vertical-align: middle; }
        /* ── Spinner ── */
        .spinner-sm { width: 1rem; height: 1rem; }
        /* ── Run result box ── */
        .result-box {
            border-radius: 10px;
            padding: 1rem 1.25rem;
            font-size: 0.9rem;
        }
        .result-success { background: #d1fae5; border-left: 4px solid #10b981; }
        .result-error   { background: #fee2e2; border-left: 4px solid #ef4444; }
        .result-running { background: #dbeafe; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <i class="fas fa-cogs me-2"></i>Leyton <span>Automation</span>
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row gap-1">
            <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">
                <i class="fas fa-gauge-high me-1"></i>Dashboard
            </a>
            <a class="nav-link {% if active_page == 'services' %}active{% endif %}" href="/ui/services">
                <i class="fas fa-play-circle me-1"></i>Services
            </a>
            <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="/ui/history">
                <i class="fas fa-clock-rotate-left me-1"></i>History
            </a>
            <a class="nav-link" href="/docs" target="_blank">
                <i class="fas fa-code me-1"></i>API Docs
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width: 1300px; margin: 0 auto;">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
