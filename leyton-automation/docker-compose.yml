version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Leyton Automation Platform — docker-compose
#
# Build context for ALL services is ./services so that the shared/ package
# (registry + logger) is reachable from every Dockerfile via COPY shared/.
#
# Networks
#   app-net    : services + api
#   monitoring : prometheus + grafana + loki + promtail
#
# Volumes
#   runs.db            : SQLite run registry shared by all services and the API
#   prometheus_data    : Prometheus TSDB (30-day retention)
#   grafana_data       : Grafana state (dashboards, users, alerts)
#   loki_data          : Loki log chunks
# ─────────────────────────────────────────────────────────────────────────────

networks:
  app-net:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ── AUTOMATION SERVICES ────────────────────────────────────────────────────

  folder-creator:
    build:
      context: ./services
      dockerfile: folder-creator/Dockerfile
    volumes:
      - ./services/folder-creator/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  timesheet-prefill:
    build:
      context: ./services
      dockerfile: timesheet-prefill/Dockerfile
    volumes:
      - ./services/timesheet-prefill/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  belspo-extractor:
    build:
      context: ./services
      dockerfile: belspo-extractor/Dockerfile
    volumes:
      - ./services/belspo-extractor/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  handover-generator:
    build:
      context: ./services
      dockerfile: handover-generator/Dockerfile
    volumes:
      - ./services/handover-generator/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  galileo-reporter:
    build:
      context: ./services
      dockerfile: galileo-reporter/Dockerfile
    volumes:
      - ./services/galileo-reporter/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  web-scraper:
    build:
      context: ./services
      dockerfile: web-scraper/Dockerfile
    volumes:
      - ./services/web-scraper/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  pdf-timesheet-extractor:
    build:
      context: ./services
      dockerfile: pdf-timesheet-extractor/Dockerfile
    volumes:
      - ./services/pdf-timesheet-extractor/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  client-onboarding-generator:
    build:
      context: ./services
      dockerfile: client-onboarding-generator/Dockerfile
    volumes:
      - ./services/client-onboarding-generator/output:/app/output
      - ./runs.db:/app/runs.db
    networks: [app-net]
    restart: "no"

  # ── API (orchestration + /metrics endpoint) ────────────────────────────────

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./runs.db:/app/runs.db
      - ./services:/app/services
    networks:
      - app-net
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── OBSERVABILITY STACK ────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: leyton-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: leyton-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=leyton2026
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    networks: [monitoring]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.7
    container_name: leyton-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.7
    container_name: leyton-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [monitoring]
    depends_on: [loki]
    restart: unless-stopped
