groups:

  # ─────────────────────────────────────────────────────────────────────────
  # SLO — Error Rate
  # Definition: percentage of service executions that ended in failure.
  # Target    : error rate < 5 % per service over a 5-minute window.
  # ─────────────────────────────────────────────────────────────────────────
  - name: leyton_slo_error_rate
    interval: 60s
    rules:

      # Raw error rate per service (0–1 ratio, 5-minute window)
      - record: leyton:service_error_rate5m
        expr: |
          rate(leyton_service_runs_total{status="failure"}[5m])
          /
          (
            rate(leyton_service_runs_total{status="success"}[5m])
            + rate(leyton_service_runs_total{status="failure"}[5m])
          )

      # Platform-wide error rate (all services combined)
      - record: leyton:platform_error_rate5m
        expr: |
          sum(rate(leyton_service_runs_total{status="failure"}[5m]))
          /
          sum(rate(leyton_service_runs_total[5m]))

      # SLO breach alert: any service exceeds 5 % error rate
      - alert: LeytonServiceErrorRateTooHigh
        expr: leyton:service_error_rate5m > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} error rate above SLO"
          description: >
            {{ $labels.service }} has an error rate of
            {{ $value | humanizePercentage }} over the last 5 minutes.
            SLO target is < 5 %.

  # ─────────────────────────────────────────────────────────────────────────
  # SLO — Latency (P95)
  # Definition: 95th-percentile execution duration per service.
  # Target    : p95 latency < 60 s per service over a 5-minute window.
  # ─────────────────────────────────────────────────────────────────────────
  - name: leyton_slo_latency
    interval: 60s
    rules:

      # P50 latency per service
      - record: leyton:service_duration_p50
        expr: |
          histogram_quantile(
            0.50,
            rate(leyton_service_duration_seconds_bucket[5m])
          )

      # P95 latency per service
      - record: leyton:service_duration_p95
        expr: |
          histogram_quantile(
            0.95,
            rate(leyton_service_duration_seconds_bucket[5m])
          )

      # P99 latency per service
      - record: leyton:service_duration_p99
        expr: |
          histogram_quantile(
            0.99,
            rate(leyton_service_duration_seconds_bucket[5m])
          )

      # SLO breach alert: p95 exceeds 60 s
      - alert: LeytonServiceLatencyTooHigh
        expr: leyton:service_duration_p95 > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} p95 latency above SLO"
          description: >
            {{ $labels.service }} p95 execution time is
            {{ $value | humanizeDuration }}.
            SLO target is < 60 s.

  # ─────────────────────────────────────────────────────────────────────────
  # Availability — Throughput
  # Useful derived metrics for the Grafana dashboard.
  # ─────────────────────────────────────────────────────────────────────────
  - name: leyton_throughput
    interval: 60s
    rules:

      # Runs per minute per service (5-minute rolling average)
      - record: leyton:service_runs_per_minute
        expr: |
          rate(leyton_service_runs_total[5m]) * 60

      # Success rate per service (inverse of error rate, easier to graph)
      - record: leyton:service_success_rate5m
        expr: |
          rate(leyton_service_runs_total{status="success"}[5m])
          /
          (
            rate(leyton_service_runs_total{status="success"}[5m])
            + rate(leyton_service_runs_total{status="failure"}[5m])
          )
