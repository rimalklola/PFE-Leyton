groups:
  - name: leyton_platform
    rules:
      - record: leyton:service_error_rate:5m
        expr: |
          rate(leyton_service_runs_total{status="failed"}[5m])
          / rate(leyton_service_runs_total[5m])

      - record: leyton:service_p95_duration:5m
        expr: |
          histogram_quantile(0.95,
            rate(leyton_service_duration_seconds_bucket[5m]))

      - alert: ServiceHighErrorRate
        expr: leyton:service_error_rate:5m > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} error rate above 50%"
